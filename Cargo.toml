[package]
name = "gpui-commands"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unified action registration, keybinding, and command palette for GPUI"
repository = "https://github.com/MrSheerluck/gpui-commands"
documentation = "https://docs.rs/gpui-commands"
categories = ["command-line-interface"]
keywords = ["gpui", "command-palette", "keybinding"]

[dependencies]
gpui = "0.2"

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }
